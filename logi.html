<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nageh.ai | ناجح التعليمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #121212; --text: #ffffff; --plus: linear-gradient(90deg, #00ff88, #00ccff); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* --- واجهة تسجيل الدخول الجديدة (بدون أنيميشن يمين وشمال) --- */
        #auth-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background: #111; border-radius: 30px; border: 1px solid #222; width: 400px; padding: 40px; box-shadow: 0 10px 30px rgba(0,255,136,0.05); text-align: center; }
        .auth-box h1 { color: var(--primary); margin-bottom: 25px; font-weight: 800; }
        .auth-box input { background: #1a1a1a; border: 1px solid #333; margin: 10px 0; padding: 14px 15px; border-radius: 12px; width: 100%; color: #fff; outline: none; transition: 0.3s; }
        .auth-box input:focus { border-color: var(--primary); }
        .auth-box button { background: var(--primary); color: #000; width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .auth-box button:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .social-login { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        .social-login a { width: 45px; height: 45px; background: #1a1a1a; border: 1px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); cursor: pointer; transition: 0.3s; }
        .social-login a:hover { border-color: var(--primary); background: #00ff8810; }

        .switch-form { margin-top: 20px; color: #888; font-size: 0.9rem; }
        .switch-form span { color: var(--primary); cursor: pointer; font-weight: 800; text-decoration: underline; margin-right: 5px; }

        /* --- واجهة الشات الأصلية --- */
        header { padding: 15px 5%; background: #0a0a0a; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); cursor: pointer; }
        .plus-btn { background: var(--plus); color: #000; padding: 8px 20px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; }
        .user-info img { width: 35px; border-radius: 50%; border: 1px solid var(--primary); cursor: pointer; }

        #chat-box { flex: 1; padding: 20px 8%; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-wrapper { display: flex; align-items: flex-start; gap: 12px; max-width: 85%; }
        .ai-wrapper { align-self: flex-start; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }

        .ai-icon { width: 38px; height: 38px; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); border: 1px solid #333; }
        .msg { padding: 15px; border-radius: 18px; line-height: 1.7; font-size: 1rem; }
        .msg.ai { background: #1a1a1a; border: 1px solid #333; white-space: pre-wrap; }
        .msg.user { background: var(--primary); color: #000; font-weight: bold; }

        .input-area { padding: 20px 8% 65px; background: #0a0a0a; border-top: 1px solid #222; }
        .input-row { display: flex; gap: 15px; align-items: center; max-width: 900px; margin: 0 auto; }
        .send-btn { background: var(--primary); border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: 900; }
        .upload-label { color: var(--primary); font-size: 1.4rem; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-content { background: #111; padding: 30px; border-radius: 35px; border: 1px solid #333; text-align: center; max-width: 450px; width: 92%; }
    </style>
</head>
<body>

<div id="auth-wrapper">
    <div class="auth-box" id="login-box">
        <h1>تسجيل الدخول</h1>
        <div class="social-login">
            <a onclick="googleAuth()"><i class="fa-brands fa-google"></i></a>
            <a onclick="appleAuth()"><i class="fa-brands fa-apple"></i></a>
        </div>
        <input type="email" id="si-email" placeholder="البريد الإلكتروني">
        <input type="password" id="si-password" placeholder="كلمة المرور">
        <button onclick="manualLogin()">دخول</button>
        <div class="switch-form">ليس لديك حساب؟ <span onclick="toggleAuth(true)">تسجيل جديد</span></div>
    </div>

    <div class="auth-box" id="signup-box" style="display:none;">
        <h1>حساب جديد</h1>
        <div class="social-login">
            <a onclick="googleAuth()"><i class="fa-brands fa-google"></i></a>
            <a onclick="appleAuth()"><i class="fa-brands fa-apple"></i></a>
        </div>
        <input type="text" id="su-name" placeholder="الاسم الكامل">
        <input type="email" id="su-email" placeholder="البريد الإلكتروني">
        <input type="password" id="su-password" placeholder="كلمة المرور">
        <button onclick="manualSignup()">إنشاء الحساب</button>
        <div class="switch-form">لديك حساب بالفعل؟ <span onclick="toggleAuth(false)">تسجيل دخول</span></div>
    </div>
</div>

<header>
    <div class="logo">nageh<span>.ai</span></div>
    <div class="user-info">
        <button id="plus-btn" class="plus-btn" onclick="showPlusModal()">NAGEH PLUS</button>
        <img id="userImg" src="" style="display:none;" onclick="handleLogout()">
    </div>
</header>

<div id="chat-box"></div>

<div class="input-area">
    <div id="preview-container" style="display:none; text-align:center; margin-bottom:10px;">
        <img id="preview-img" src="" style="height:60px; border:2px solid var(--primary); border-radius:10px;">
        <span onclick="cancelImage()" style="cursor:pointer; color:red; margin-right:10px;"><i class="fas fa-times-circle"></i></span>
    </div>
    <p id="counter" style="text-align:center; font-size:0.8rem; color:var(--primary); font-weight:800; margin-bottom:10px;"></p>
    <div class="input-row">
        <label for="file-input" class="upload-label"><i class="fas fa-file-pdf"></i></label>
        <input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="processPDF(this)">
        <label for="image-input" class="upload-label"><i class="fas fa-camera"></i></label>
        <input type="file" id="image-input" accept="image/*" style="display:none" onchange="previewImage(this)">
        <input type="text" id="userInput" placeholder="اسأل ناجح...">
        <button class="send-btn" onclick="askAI()">إرسال</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
        GoogleAuthProvider, OAuthProvider, signInWithPopup, updateProfile,
        onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyANyl6OjwmqySpjyvqIPNw9LubCybjiCEQ",
        authDomain: "login-fb922.firebaseapp.com",
        projectId: "login-fb922",
        storageBucket: "login-fb922.firebasestorage.app",
        messagingSenderId: "84509030092",
        appId: "1:84509030092:web:bbbcb53a09ee45e9f9f469"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // جعل الدوال متاحة للـ HTML
    window.toggleAuth = (isSignup) => {
        document.getElementById('login-box').style.display = isSignup ? 'none' : 'block';
        document.getElementById('signup-box').style.display = isSignup ? 'block' : 'none';
    };

    window.manualLogin = () => {
        signInWithEmailAndPassword(auth, document.getElementById('si-email').value, document.getElementById('si-password').value)
        .catch(err => alert("خطأ في البيانات"));
    };

    window.manualSignup = () => {
        createUserWithEmailAndPassword(auth, document.getElementById('su-email').value, document.getElementById('su-password').value)
        .then(res => updateProfile(res.user, { displayName: document.getElementById('su-name').value }))
        .catch(err => alert(err.message));
    };

    window.googleAuth = () => signInWithPopup(auth, googleProvider);
    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, user => {
        if(user){
            document.getElementById("auth-wrapper").style.display = "none";
            document.getElementById("userImg").style.display = "block";
            document.getElementById("userImg").src = user.photoURL || "https://i.imgur.com/6VBx3io.png";
            initNageh(user.displayName || user.email);
        } else {
            document.getElementById("auth-wrapper").style.display = "flex";
            document.getElementById("userImg").style.display = "none";
        }
    });
</script>

<script>
    // --- كود ناجح AI الأصلي المتبقي ---
    const API_KEY = "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";
    let pdfText = "", selectedImageBase64 = null;
    let attempts = localStorage.getItem('nageh_usage_global') || 10;

    function initNageh(name) {
        if(document.getElementById('chat-box').children.length === 0) {
            addMessage(`أهلاً بك ${name} في ناجح AI.. كيف أساعدك اليوم؟`, "ai");
        }
        document.getElementById('counter').innerText = `المحاولات المتبقية: ${attempts}`;
    }

    async function askAI() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text && !selectedImageBase64) return;
        if(attempts <= 0) { alert("انتهت المحاولات!"); return; }

        addMessage(text, "user", selectedImageBase64);
        const currentImg = selectedImageBase64;
        cancelImage(); input.value = "";

        // محاكاة الإرسال للـ API
        setTimeout(() => {
            addMessage("أنا أحلل طلبك الآن.. (تأكد من ربط الـ API KEY بشكل صحيح لردود حقيقية)", "ai");
            attempts--;
            localStorage.setItem('nageh_usage_global', attempts);
            document.getElementById('counter').innerText = `المحاولات المتبقية: ${attempts}`;
        }, 1000);
    }

    function addMessage(text, side, img = null) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg-wrapper ${side}-wrapper`;
        div.innerHTML = side === 'ai' ? `<div class="ai-icon"><i class="fas fa-user-graduate"></i></div><div class="msg ai">${text}</div>` : `<div class="msg user">${text}</div>`;
        if(img && side === 'user') div.querySelector('.msg').innerHTML += `<br><img src="data:image/jpeg;base64,${img}" style="max-width:200px; border-radius:10px; margin-top:10px;">`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function previewImage(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImageBase64 = e.target.result.split(',')[1];
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }
    function cancelImage() { selectedImageBase64 = null; document.getElementById('preview-container').style.display = 'none'; }
</script>
</body>
</html>
